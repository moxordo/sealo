name: sealo

options:
  bundleIdPrefix: com.moxordo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
  generateEmptyDirectories: true

# SPM packages: none in M0. swift-snapshot-testing deferred to M1
# (Xcode 26.4/Swift 6.3 module compatibility issue with the current
# release; see docs/02-progress.md deviations). GRDB.swift deferred
# to M2 (no consumer until persistence layer lands).

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    COPY_PHASE_STRIP: NO
    # Signing team — baked in so xcodegen regeneration doesn't wipe
    # the manual GUI selection every time. If another developer joins
    # the project, they override this via an .xcconfig or by replacing
    # this line with their own team ID. 10-char Apple Team ID from
    # developer.apple.com/account → Membership.
    DEVELOPMENT_TEAM: "8F5KY4977A"
    # Concurrency strictness deliberately left at default (minimal).
    # Dial up to "complete" in M2 once real concurrency surface exists;
    # turning it on now would produce warnings that gate the M0 clean build.
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  sealo:
    type: application
    platform: iOS
    sources:
      - path: sealo
    dependencies:
      - target: sealoMonitor
        embed: true
        codeSign: true
      - target: sealoWidget
        embed: true
        codeSign: true
      - target: sealoShieldConfig
        embed: true
        codeSign: true
      - target: sealoShieldAction
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxordo.sealo
        PRODUCT_NAME: sealo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sealo
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Required for the main app to request Live Activities via
        # ActivityKit. Without this key, Activity.request() throws.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: sealo/sealo.entitlements

  sealoMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: sealoMonitor
      # Include Domain types so the extension can use DailyBudget
      # accounting logic (fillFraction, shouldPreArmShield, etc.)
      # and SharedState for App Group IPC.
      - path: sealo/Domain
      - path: sealo/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxordo.sealo.monitor
        PRODUCT_NAME: sealoMonitor
        PRODUCT_MODULE_NAME: sealoMonitor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: sealoMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: sealoMonitor/sealoMonitor.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        # Tags FileLogger entries from this target as "monitor"
        # (vs "app" for the main target). See Log.Channel.source.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MONITOR_EXTENSION"

  sealoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: sealoWidget
      # Share domain + shared-state + design-system sources so the
      # widget can render OxygenTankGauge and read SharedDefaults
      # without an extra framework target.
      - path: sealo/Domain
      - path: sealo/Shared
      - path: sealo/UI/DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxordo.sealo.widget
        PRODUCT_NAME: sealoWidget
        PRODUCT_MODULE_NAME: sealoWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: sealoWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: sealoWidget/sealoWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        # Widget extension compiles the shared Log.Channel, which
        # needs to know if it's in the "widget" source.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"

  sealoShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: sealoShieldConfig
      # No domain sources needed — the shield config is a pure UI
      # data source, computes nothing from app state.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxordo.sealo.shieldconfig
        PRODUCT_NAME: sealoShieldConfig
        PRODUCT_MODULE_NAME: sealoShieldConfig
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: sealoShieldConfig/Info.plist
        CODE_SIGN_ENTITLEMENTS: sealoShieldConfig/sealoShieldConfig.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  sealoShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: sealoShieldAction
      # Shield action needs Domain types (DailyBudget), SharedDefaults
      # for IPC, DiveActivityAttributes for the Live Activity update,
      # and LiveActivityController to push updates. Same pattern as
      # sealoMonitor.
      - path: sealo/Domain
      - path: sealo/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxordo.sealo.shieldaction
        PRODUCT_NAME: sealoShieldAction
        PRODUCT_MODULE_NAME: sealoShieldAction
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: sealoShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: sealoShieldAction/sealoShieldAction.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        # Tags FileLogger entries from this target as a unique source.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHIELD_ACTION_EXTENSION"

  sealoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: sealoTests
    dependencies:
      - target: sealo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxordo.sealo.tests
        PRODUCT_NAME: sealoTests
        PRODUCT_MODULE_NAME: sealoTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/sealo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/sealo"

  sealoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: sealoUITests
    dependencies:
      - target: sealo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxordo.sealo.uitests
        PRODUCT_NAME: sealoUITests
        PRODUCT_MODULE_NAME: sealoUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: sealo

schemes:
  sealo:
    build:
      targets:
        sealo: all
        sealoTests: [test]
        sealoUITests: [test]
    run:
      config: Debug
      commandLineArguments: {}
      environmentVariables: []
    test:
      config: Debug
      targets:
        - sealoTests
        - sealoUITests
      gatherCoverageData: true
      coverageTargets:
        - sealo
